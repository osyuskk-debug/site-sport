<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunSmart</title>
<style>
:root{--red:#c70101;--red-d:#a00000;--bg:#fff;--soft:#f5f5f5;--text:#0d0d0d;--muted:#555;--card:#fff;--cardtext:#0d0d0d;--line:#e3e3e3;--head:rgba(0,0,0,.85);--modal:#fff}
body.dark{--bg:#121212;--soft:#1b1b1b;--text:#f2f2f2;--muted:#b5b5b5;--card:#1e1e1e;--cardtext:#f2f2f2;--line:#333;--head:rgba(0,0,0,.92);--modal:#1e1e1e}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;transition:background-color .2s,color .2s}
button{font-family:inherit}
a{color:inherit}
.page{display:none}
.page.active{display:block}

/* header */
header{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:16px 16px;color:#fff}
header.solid{position:sticky;background:var(--head)}
.hwrap{width:100%;max-width:1140px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{width:300px;height:54px;cursor:pointer;display:block;image-rendering:auto;backface-visibility:hidden;transform:translateZ(0);transition:transform .25s ease}
.logo:hover{transform:scale(1.08)}
.hright{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.rep{font-size:12px;line-height:1.3}
.rep b{display:block;font-size:14px}
.phone{font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;text-decoration:underline;transition:transform .25s ease}
.phone:hover{transform:scale(1.1)}
nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nav-btn{background:transparent;border:2px solid #fff;color:#fff;padding:11px 20px;font-size:15px;font-weight:700;text-transform:uppercase;cursor:pointer;border-radius:4px;letter-spacing:.3px;white-space:nowrap}
.nav-btn{transition:transform .25s ease,background-color .2s,border-color .2s,box-shadow .25s}
.nav-btn:hover{background:var(--red);border-color:var(--red);transform:scale(1.1);box-shadow:0 8px 20px rgba(199,1,1,.4)}
.cat-wrap{position:relative}
.cat-arrow{position:absolute;left:50%;top:-50px;width:40px;height:32px;fill:var(--red);transform:translateX(-50%);animation:bob 1.2s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}
.tools{display:flex;gap:6px;align-items:center}
.lang button,.theme{background:transparent;border:1px solid #888;color:#fff;height:30px;padding:0 10px;font-size:12px;cursor:pointer}
.lang button,.theme{transition:transform .2s ease,background-color .2s}
.lang button:hover,.theme:hover{transform:scale(1.15)}
.lang button.on{background:var(--red);border-color:var(--red)}
.btn-red{display:inline-block;border:none;background:var(--red);color:#fff;padding:0 24px;height:50px;line-height:50px;font-size:14px;font-weight:700;text-transform:uppercase;cursor:pointer;text-decoration:none;text-align:center;min-width:170px}
.btn-red:hover{background:var(--red-d)}
.btn-red.sm{height:34px;line-height:34px;min-width:0;padding:0 14px;font-size:12px}
.btn-red.sm{transition:transform .25s ease,box-shadow .25s ease,background-color .2s}
.btn-red.sm:hover{transform:scale(1.1);box-shadow:0 8px 20px rgba(199,1,1,.4)}

.hero .sub{margin:14px 0 0;font-size:22px;text-transform:uppercase;font-weight:500}
.perks{display:flex;justify-content:center;gap:30px;margin:48px 0 40px;font-size:13px;text-transform:uppercase}
.perks div{width:200px;line-height:1.35;padding:14px 12px;border:2px solid #fff;border-radius:12px;background:rgba(0,0,0,.28);box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .25s ease,border-color .25s,background-color .25s;cursor:default}
.perks .pdesc{display:none;margin-top:8px;font-size:12px;line-height:1.45;text-transform:none;font-weight:400;color:#fff}
.perks .pdesc a{color:#fff;font-weight:700;font-size:14px;text-decoration:underline}
.perks div:hover .pdesc{display:block}
.perks div:hover{transform:scale(1.08);border-color:var(--red);background:rgba(199,1,1,.35)}
.perks img{display:block;margin:0 auto 10px;height:46px;width:auto;image-rendering:auto}
.hero .go{display:block;margin:0 auto;width:303px}
.hero .go{transition:transform .25s ease,box-shadow .25s ease,background-color .2s}
.hero .go:hover{transform:scale(1.1);box-shadow:0 10px 24px rgba(199,1,1,.45)}
.hero .alt{margin-top:14px;font-size:16px;text-transform:uppercase}
.hero .alt button{background:none;border:none;color:#fff;text-decoration:underline;font-size:16px;text-transform:uppercase;cursor:pointer;padding:0}

/* advantages */
.adv{background:var(--soft);padding:50px 16px 60px;text-align:center}
.adv h2,.sec-title{font-size:30px;font-weight:400;text-transform:uppercase;margin:0 0 40px}
.adv-grid{display:flex;justify-content:center;align-items:stretch;flex-wrap:wrap;max-width:1140px;margin:0 auto}
.adv-col{width:340px;padding:12px 36px;transition:transform .3s ease,background-color .3s;cursor:default;border-radius:6px}
.adv-col + .adv-col{border-left:2px solid #c4c4c4}
body.dark .adv-col + .adv-col{border-left-color:#444}
.adv-long{display:none}
.adv-col:hover .adv-long{display:block}
.adv-col:hover .adv-short{display:none}
.adv-col:hover{transform:scale(1.07);background:var(--card);box-shadow:0 10px 26px rgba(0,0,0,.15);z-index:2;position:relative}
.adv-col img{width:70px;height:70px;display:block;margin:0 auto 20px}
.adv-col h3{font-size:18px;text-transform:uppercase;margin:0 0 14px;font-weight:700}
.adv-col p{font-size:14px;line-height:1.7;color:var(--muted);margin:0}

/* carousel */
.carousel{position:relative;width:620px;max-width:94%;margin:50px auto}
.carousel img.slide{width:100%;display:block;border:6px solid var(--red);border-radius:6px;box-shadow:0 10px 26px rgba(199,1,1,.3);transition:transform .35s ease,box-shadow .35s ease;transform-origin:center}
.carousel:hover img.slide{transform:scale(.88);box-shadow:0 6px 16px rgba(199,1,1,.2)}
.carousel .arr{position:absolute;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;padding:0}
.carousel .arr img{display:block;width:31px;height:50px}
.carousel .arr.l{left:-50px}
.carousel .arr.r{right:-50px}

/* reviews */
.reviews{padding:30px 16px 60px;background:var(--bg)}
.reviews .sec-title{text-align:center}
.rev-list{width:915px;max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.rev{display:flex;gap:28px;padding:18px;cursor:pointer;border:none;border-left:5px solid var(--red);border-right:5px solid var(--red);border-radius:4px;transition:transform .25s ease,background-color .2s;will-change:transform}
.rev:hover{transform:scale(1.04);background:var(--soft)}
.rev.sel{background:var(--soft)}
.rev img{width:169px;height:169px;object-fit:cover;flex:0 0 169px;border-radius:2px}
.rev h4{margin:0;font-size:16px;text-transform:uppercase}
.rev small{display:block;color:var(--red);font-size:14px;margin:4px 0 12px}
.rev p{margin:0;font-size:14px;line-height:1.6;color:var(--muted);white-space:pre-line}
.rev.sel p{color:var(--text);background:rgba(199,1,1,.08);padding:4px 6px}
.stars{display:none;margin-top:14px;font-size:22px;color:var(--red);letter-spacing:3px}
.rev.sel .stars,.rev:hover .stars{display:block}
.stars span.dim{color:#999}
.stars-label{font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}

footer::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.15)}
.info{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:460px;max-width:90%;padding:44px 20px;background:var(--modal);color:var(--text);text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.info h3{font-size:20px;font-weight:700;margin:0 0 8px;text-transform:uppercase}
.info .ph{font-size:14px;margin:0 0 26px;cursor:pointer;text-decoration:none;color:#fff;background:var(--red);font-weight:700;display:table;margin-left:auto;margin-right:auto;padding:9px 18px;border-radius:4px;letter-spacing:.3px;transition:transform .25s ease,box-shadow .25s ease}
.info .ph:hover{transform:scale(1.12);box-shadow:0 6px 16px rgba(199,1,1,.35)}
.gis-btn{display:flex;width:max-content;align-items:center;gap:8px;margin:0 auto 14px;padding:8px 14px;border:2px solid var(--red);background:transparent;color:var(--red);font-weight:700;font-size:14px;cursor:pointer;border-radius:4px}
.gis-btn svg{width:22px;height:22px}
.gis-btn{transition:transform .25s ease,background-color .2s,color .2s}
.gis-btn:hover{background:var(--red);color:#fff;transform:scale(1.12)}
.gis-btn:hover svg{fill:#fff}
.socials{display:flex;justify-content:center;gap:18px}
.socials button{width:52px;height:52px;border-radius:50%;border:2px solid var(--red);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.socials button{transition:transform .25s ease,box-shadow .25s ease}
.socials button:hover{transform:scale(1.2);box-shadow:0 6px 16px rgba(199,1,1,.35)}
.socials svg{width:24px;height:24px;fill:none;stroke:var(--red);stroke-width:2}
.socials svg.fill{fill:var(--red);stroke:none}

/* catalog */
.catalog{padding:120px 16px 60px;text-align:center}
.catalog h1{font-size:30px;font-weight:400;text-transform:uppercase;margin:0 0 40px}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;margin:0 auto 46px}
.tab{height:50px;padding:0 30px;border:2px solid #888;background:transparent;color:var(--muted);font-size:15px;text-transform:uppercase;cursor:pointer;margin:0 -1px}
.tab.active{background:var(--red);border-color:var(--red);color:#fff}
.grid{width:944px;max-width:100%;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{position:relative;background:var(--card);color:var(--cardtext);border:1px solid var(--line);min-height:460px;padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .3s ease,box-shadow .3s ease}
.card:hover,.card.show{transform:scale(1.05);z-index:3;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.card .info-panel{position:absolute;left:0;right:0;bottom:92px;padding:14px 18px;background:var(--card);border-top:3px solid var(--red);box-shadow:0 -6px 16px rgba(0,0,0,.15);opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:none}
.card:hover .info-panel,.card.show .info-panel{opacity:1;transform:none}
.card .info-panel ul{display:block;list-style:none;margin:0;padding:0;text-align:left;font-size:13px;line-height:1.5}
.card .info-panel li{position:relative;padding-left:16px;margin-bottom:8px}
.card .info-panel li::before{content:"";position:absolute;left:3px;top:7px;width:6px;height:6px;background:var(--red)}
.card.best{border:3px solid #d4af37;box-shadow:0 0 0 2px rgba(212,175,55,.3),0 8px 22px rgba(212,175,55,.35)}
.card .badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;padding:5px 14px;border-radius:3px;white-space:nowrap;letter-spacing:.5px;z-index:4}
.card img.pic{width:140px;height:200px;object-fit:contain}
.card h3{font-size:16px;font-weight:700;text-transform:uppercase;margin:14px 0 10px}
.card p{font-size:14px;font-weight:300;line-height:1.5;margin:0;min-height:42px;color:var(--cardtext)}
.card .more{margin-top:12px;color:var(--red);font-size:14px;text-decoration:underline;text-transform:uppercase;background:none;border:none;cursor:pointer}

.card .bottom{margin-top:auto;width:100%;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.card .old{font-size:14px;color:var(--muted);text-decoration:line-through;display:block}
.card .new{font-size:20px;font-weight:700;display:block}
.card .buy{height:44px;padding:0 22px;border:none;background:var(--red);color:#fff;text-transform:uppercase;font-size:14px;cursor:pointer}

.consult::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.5)}
.consult .inner{position:relative}
.consult h1{font-size:32px;font-weight:700;text-transform:uppercase;margin:0 0 16px;line-height:1.3}
.consult p.lead{font-size:17px;margin:0 0 36px;font-weight:300}

/* forms */
.form{width:303px;max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.form input,.form select{height:50px;padding:0 14px;border:1px solid #bbb;background:#fff;color:#111;font-size:14px;width:100%;font-family:inherit}
.form .btn-red{width:100%;min-width:0}
.form label{font-size:14px;color:inherit}
.form label.radio{display:flex;gap:8px;align-items:center}
.plain{min-height:560px;background:var(--soft);padding:130px 16px 60px;text-align:center}
.plain h1{font-size:28px;text-transform:uppercase;margin:0 0 20px}
.plain .notice{max-width:420px;margin:0 auto 22px;border-left:4px solid var(--red);background:var(--card);color:var(--text);padding:12px 16px;text-align:left;font-size:14px}

.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--modal);color:var(--text);padding:34px 28px;max-width:380px;width:100%;text-align:center;position:relative}
.modal-box .close{position:absolute;top:8px;right:12px;background:none;border:none;font-size:26px;cursor:pointer;color:var(--text)}
.modal-box h2{font-size:20px;margin:0 0 10px}
.modal-box .btn-red{margin:6px 0;width:100%;min-width:0}
.wa{background:#25d366!important}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--red);margin:0 auto 14px}
.rate-stars{display:flex;justify-content:center;gap:8px;margin:18px 0 8px}
.rate-stars button{background:none;border:none;font-size:40px;color:#888;cursor:pointer;padding:0;line-height:1}
.rate-stars button.on{color:var(--red)}
#rate-result{min-height:90px;display:flex;align-items:center;justify-content:center;font-size:60px;line-height:1.2}
#rate-result .thanks{font-size:18px;font-weight:700;color:var(--text)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:200;display:none}
.scroll-btn{position:fixed;width:46px;height:46px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:22px;cursor:pointer;z-index:90;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#home-btn{position:fixed;top:150px;left:12px;z-index:95;display:none;align-items:center;gap:8px;height:50px;padding:0 18px 0 14px;background:var(--red);color:#fff;border:none;border-radius:26px;font-size:15px;font-weight:700;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px rgba(199,1,1,.45);transition:transform .2s ease,background-color .2s}
#home-btn:hover{transform:scale(1.06);background:var(--red-d)}
#home-btn svg{width:22px;height:22px;fill:#fff}
#scroll-down{right:16px;bottom:16px}
#scroll-up{left:12px;top:226px}

@media (max-width:980px){
  .carousel .arr.l{left:4px}.carousel .arr.r{right:4px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .rev{flex-direction:column}
  .rev img{width:120px;height:120px;flex:none}
}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .hero{height:auto;padding-bottom:60px}
  .hero .inner{padding-top:140px}
  .hero h1{font-size:30px}
  .carousel img.slide{width:100%}
}

/* ---------- responsive: tablets and phones ---------- */
@media (max-width: 900px){
  header{position:relative;padding:12px 14px;background:var(--head)}
  header.solid{position:sticky}
  .hwrap{justify-content:center;gap:10px;max-width:100%}
  .hright{justify-content:center;gap:10px}
  .rep{display:none}
  .logo{width:230px;height:41px}
  .cat-arrow{top:-30px;width:24px;height:19px}
  .hero{height:auto;padding-bottom:50px}
  .hero .inner{padding-top:50px}
  .hero h1{font-size:30px}
  .hero .sub{font-size:17px}
  .perks{flex-wrap:wrap;gap:12px;padding:0 10px;margin:34px 0 30px}
  .perks div{width:31%;max-width:200px;padding:10px 6px}
  .adv{padding:40px 16px 50px}
  .adv-grid{flex-direction:column;align-items:center}
  .adv-col{width:100%;max-width:460px;border-left:none}
  .adv-col + .adv-col{border-left:none;border-top:2px solid #c4c4c4}
  .catalog{padding-top:50px}
  .carousel{width:94%}
  footer{height:auto;padding:60px 16px 40px;background-position:center}
  .info{position:relative;left:auto;top:auto;transform:none;margin:0 auto;width:100%;max-width:460px;padding:36px 18px}
  .consult{min-height:auto;padding-top:60px}
  .plain{min-height:auto;padding-top:60px}
}
@media (max-width: 600px){
  .hright .phone{font-size:14px}
  nav{width:100%;justify-content:center}
  .nav-btn{padding:9px 14px;font-size:13px}
  .tools{width:100%;justify-content:center;flex-wrap:wrap}
  .btn-red.sm{padding:0 12px;font-size:11px}
  .perks div{width:46%}
  .perks{gap:12px 8px}
  .hero h1{font-size:26px}
  .hero .sub{font-size:15px}
  .hero .go{width:min(303px,92%)}
  .catalog h1{font-size:24px}
  .tabs{gap:6px}
  .tab{padding:0 14px;font-size:13px;height:44px;margin:0}
  .grid{grid-template-columns:1fr;max-width:340px}
  .card{min-height:430px}
  .card p{min-height:auto}
  .adv h2,.sec-title{font-size:22px;margin-bottom:24px}
  .rev{flex-direction:column;align-items:center;text-align:center;gap:14px}
  .rev img{width:150px;height:150px;flex:none}
  .rev-list{width:100%}
  .rev small{margin-bottom:8px}
  .consult h1{font-size:23px}
  .consult p.lead{font-size:15px;margin-bottom:24px}
  .form{width:100%}
  .info h3{font-size:17px}
  .info .ph{font-size:13px}
  .modal-box{padding:26px 18px}
  .rate-stars button{font-size:34px}
  #home-btn{top:auto;bottom:130px;left:12px;height:44px;padding:0 14px 0 12px;font-size:13px}
  #scroll-up{top:auto;bottom:70px;left:12px}
  #scroll-down{bottom:16px;right:12px}
}
@media (min-width: 601px) and (max-width: 900px){
  .grid{grid-template-columns:repeat(2,1fr);max-width:640px}
}
</style>

/* ---------- language + theme ---------- */
function setLang(l){
  lang = l;
  document.documentElement.lang = l === 'kz' ? 'kk' : l;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = tr(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = tr(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = tr(el.dataset.i18nPh));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
  document.getElementById('theme-btn').textContent = dark ? tr('theme_light') : tr('theme_dark');
  document.querySelectorAll('.rev').forEach(r => renderStars(r));
  renderCatalog();
  if (rated) rateProduct(rateValue);
  if (location.hash === '#/checkout') renderCheckout();
}
function toggleTheme(){
  dark = !dark;
  document.body.classList.toggle('dark', dark);
  document.getElementById('theme-btn').textContent = dark ? tr('theme_light') : tr('theme_dark');
}

/* ---------- routing ---------- */
function go(hash){ location.hash = hash; }
function route(){
  let page = (location.hash.replace('#/','') || 'home').split('?')[0];
  if (!document.querySelector(`.page[data-page="${page}"]`)) page = 'home';
  if (page === 'checkout' && !user) page = 'login';
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.dataset.page === page));
  document.getElementById('header').classList.toggle('solid', page !== 'home');
  document.getElementById('home-btn').style.display = page === 'catalog' ? 'flex' : 'none';
  if (page === 'catalog') renderCatalog();
  if (page === 'checkout') renderCheckout();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---------- catalog ---------- */
function setCat(c){ currentCat = c; renderCatalog(); }
function renderCatalog(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === currentCat));
  const items = PRODUCTS.filter(p => p.cat === currentCat);
  const minPrice = Math.min(...items.map(p => p.price));
  const bullets = tr('bullets').map(b => `<li>${b}</li>`).join('');
  document.getElementById('grid').innerHTML = items.map(p => `
    <div class="card${p.price === minPrice ? ' best' : ''}" data-id="${p.id}">
      ${p.price === minPrice ? `<span class="badge">${tr('badge_best')}</span>` : ''}
      <img class="pic" src="${PIC}" alt="">
      <h3>${p.name[lang]}</h3>
      <p>${tr(p.d)}</p>
      <div class="info-panel"><ul>${bullets}</ul></div>
      <button class="more" onclick="toggleCard(${p.id})">${tr('more')}</button>
      <div class="bottom">
        <div><span class="old">${fmt(p.old)}</span><span class="new">${fmt(p.price)}</span></div>
        <button class="buy" onclick="buy(${p.id})">${tr('buy')}</button>
      </div>
    </div>`).join('');
}
function toggleCard(id){
  const c = document.querySelector(`.card[data-id="${id}"]`);
  const shown = c.classList.toggle('show');
  c.querySelector('.more').textContent = shown ? tr('back') : tr('more');
}
function buy(id){
  pendingProduct = PRODUCTS.find(p => p.id === id);
  go(user ? '#/checkout' : '#/login');
}

/* ---------- checkout ---------- */
function renderCheckout(){
  document.getElementById('checkout-item').textContent =
    pendingProduct ? `${tr('item')}: ${pendingProduct.name[lang]} — ${fmt(pendingProduct.price)}` : tr('cart_empty');
  toggleAddress();
}
function toggleAddress(){
  const pickup = document.querySelector('#checkout-form input[name="method"]:checked').value === 'pickup';
  document.getElementById('address-block').classList.toggle('hidden', pickup);
  document.querySelector('#checkout-form input[name="address"]').required = !pickup;
}
function submitLogin(e){
  e.preventDefault();
  user = {email: e.target.email.value};
  e.target.reset();
  go(pendingProduct ? '#/checkout' : '#/catalog');
}
function submitOrder(e){
  e.preventDefault();
  const f = e.target;
  const where = f.method.value === 'pickup' ? tr('pickup_to') : `${tr('delivery_to')}: ${f.address.value}`;
  alert(`${tr('order_ok')}\n${pendingProduct ? pendingProduct.name[lang] : ''}\n${where}\n${tr('time_to')}: ${f.time.value}`);
  pendingProduct = null;
  go('#/');
}

/* ---------- consult ---------- */
function submitConsult(e){
  e.preventDefault();
  e.target.reset();
  openModal('success-modal');
  fireworks();
}

/* ---------- reviews ---------- */
function renderStars(card){
  const n = +card.dataset.stars;
  const row = card.querySelector('[data-stars-row]');
  row.innerHTML = [1,2,3,4,5].map(i => `<span class="${i<=n?'':'dim'}">★</span>`).join('');
  card.querySelector('.stars-label').textContent = `${tr('rating')}: ${n}/5`;
}
function toggleReview(el){
  renderStars(el);
  el.classList.toggle('sel');
}

/* ---------- rating popup ---------- */
let rateValue = 0;
let rated = false;
function paintStars(n){
  document.querySelectorAll('#rate-stars button').forEach(b => b.classList.toggle('on', +b.dataset.v <= n));
}
function rateProduct(n){
  rateValue = n;
  rated = true;
  paintStars(n);
  const box = document.getElementById('rate-result');
  if (n < 3) box.innerHTML = n === 1 ? '😠' : '😞';
  else box.innerHTML = `<div class="thanks">${tr('rate_thanks')}</div>`;
  if (n > 3) fireworks('big');
}
/* counts 12 s of visible viewing time, starting after the page has loaded */
/* the 12 seconds start only when the visitor actually starts looking at the page
   (first click, key press, touch, scroll or wheel), not when the file is loaded */
let viewStart = null;
function startViewing(){ if (viewStart === null && !document.hidden) viewStart = Date.now(); }
['pointerdown','keydown','touchstart','wheel','scroll'].forEach(ev =>
  window.addEventListener(ev, startViewing, {passive:true, once:false}));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) viewStart = null; else if (viewStart !== null) viewStart = Date.now();
});
function tryRatePopup(){
  if (rated) return;
  if (viewStart !== null && !document.hidden && Date.now() - viewStart >= 12000){
    if (!document.getElementById('rate-modal').classList.contains('open')) openModal('rate-modal');
    return;
  }
  setTimeout(tryRatePopup, 500);
}
tryRatePopup();

/* ---------- modals ---------- */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function openSocial(network, name, handle){
  document.getElementById('social-name').textContent = name;
  document.getElementById('social-handle').textContent = `${network}: ${handle}`;
  openModal('social-modal');
}

/* ---------- carousel (single slide) ---------- */
/* arrows kept for layout; one slide in source file */

/* ---------- scroll buttons: one screen per click, double click = to the very end/start ---------- */
let lastScrollClick = {1:0, '-1':0};
function scrollStep(dir){
  const now = Date.now();
  const fast = now - lastScrollClick[dir] < 450;
  lastScrollClick[dir] = now;
  if (fast){
    window.scrollTo({top: dir > 0 ? document.body.scrollHeight : 0, behavior:'smooth'});
  } else {
    window.scrollBy({top: dir * window.innerHeight * 0.9, behavior:'smooth'});
  }
}

/* ---------- fireworks (short, light) ---------- */
function fireworks(mode){
  const big = mode === 'big';
  const c = document.getElementById('fx');
  const ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
  const colors = ['#c70101','#ffd23f','#3ddc97','#4cc9f0','#ffffff','#ff7ab6'];
  const parts = [];
  const burst = () => {
    const x = Math.random()*c.width, y = Math.random()*c.height*0.55 + 60;
    const col = colors[Math.floor(Math.random()*colors.length)];
    const n = big ? 90 : 40, speed = big ? 6 : 4;
    for (let i = 0; i < n; i++){
      const a = Math.random()*Math.PI*2, s = (Math.random()*0.5 + 0.5)*speed;
      parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, col: Math.random()<0.2 ? colors[Math.floor(Math.random()*colors.length)] : col, sz: big ? 4 + Math.random()*3 : 3});
    }
  };
  const bursts = big ? 12 : 4;
  const gap = big ? 14 : 25;
  let frames = 0, spawned = 0;
  const total = big ? 230 : 100;
  (function tick(){
    if (spawned < bursts && frames % gap === 0){ burst(); spawned++; }
    ctx.clearRect(0,0,c.width,c.height);
    for (const p of parts){
      p.x += p.vx; p.y += p.vy; p.vy += 0.07; p.vx *= 0.99; p.life -= big ? 0.011 : 0.02;
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.min(1, p.life * 1.4);
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x, p.y, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    frames++;
    if (frames < total) requestAnimationFrame(tick);
    else { ctx.clearRect(0,0,c.width,c.height); c.style.display = 'none'; }
  })();
}

route();
setLang('ru');
</script>
